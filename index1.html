<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Video Hub</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:Arial,sans-serif;background:#f0f2f5;display:flex;height:100vh;overflow:hidden;}
        
        /* Sidebar */
        .sidebar{width:250px;background:#1a1a2e;color:#fff;height:100%;position:fixed;left:0;top:0;transition:0.3s;z-index:1000;overflow-y:auto;}
        .sidebar.closed{left:-250px;}
        .sidebar-header{padding:20px;font-size:22px;font-weight:bold;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;}
        .close-btn{background:none;border:none;color:#fff;font-size:28px;cursor:pointer;}
        .menu-item{padding:15px 20px;border-bottom:1px solid #2a2a4a;cursor:pointer;transition:0.2s;display:flex;align-items:center;gap:12px;}
        .menu-item:hover{background:#16213e;}
        .menu-item i{font-size:20px;width:25px;text-align:center;}
        .menu-item.active{background:#0f3460;}
        
        /* Main Content */
        .main{flex:1;margin-left:250px;padding:20px;transition:0.3s;height:100vh;overflow-y:auto;background:#f0f2f5;}
        .main.expanded{margin-left:0;}
        
        /* Top Bar */
        .topbar{display:flex;align-items:center;gap:15px;padding-bottom:20px;border-bottom:1px solid #ddd;margin-bottom:20px;}
        .menu-icon{font-size:28px;cursor:pointer;background:none;border:none;color:#1a1a2e;}
        
        /* Health Banner */
        .health-banner{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;padding:15px 25px;border-radius:10px;text-align:center;font-size:22px;font-weight:bold;margin-bottom:20px;box-shadow:0 4px 15px rgba(46,125,50,0.3);}
        .health-banner span{font-size:28px;margin-right:10px;}
        
        /* Page Content */
        .page{display:none;}
        .page.active{display:block;}
        
        /* Upload Box */
        .upload-box{background:#fff;padding:30px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,0.1);text-align:center;max-width:500px;margin:0 auto;}
        .upload-box h2{color:#1a1a2e;margin-bottom:10px;}
        .upload-box p{color:#666;margin-bottom:20px;font-size:14px;}
        input[type="file"]{display:none;}
        .btn{background:#1a73e8;color:#fff;padding:12px 28px;border-radius:6px;cursor:pointer;font-size:15px;font-weight:600;border:none;transition:0.3s;display:inline-block;}
        .btn:hover{background:#1557b0;}
        #msg{margin-top:15px;font-weight:500;font-size:14px;}
        .ok{color:#2e7d32;}
        .err{color:#c62828;}
        #videoPreview{margin-top:20px;width:100%;max-height:400px;border-radius:8px;background:#000;display:none;object-fit:contain;}
        
        /* Video Grid */
        .video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:20px;}
        .video-card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,0.1);position:relative;}
        .video-card .video-wrapper{width:100%;background:#000;display:flex;justify-content:center;align-items:center;overflow:hidden;}
        .video-card video{width:100%;height:auto;max-height:300px;object-fit:contain;display:block;}
        .video-card .info{padding:12px;display:flex;flex-direction:column;gap:6px;}
        .video-card .info .row1{display:flex;justify-content:space-between;align-items:center;}
        .video-card .title{font-weight:bold;font-size:14px;color:#1a1a2e;word-break:break-all;}
        .video-card .meta{font-size:12px;color:#888;display:flex;gap:12px;align-items:center;}
        .video-card .meta .size{background:#f0f0f0;padding:2px 10px;border-radius:10px;}
        .video-card .meta .aspect{background:#e3f2fd;padding:2px 10px;border-radius:10px;color:#1565c0;font-weight:500;}
        .fav-btn{background:none;border:none;font-size:20px;cursor:pointer;transition:0.2s;}
        .fav-btn.favorited{color:#e74c3c;}
        .fav-btn:not(.favorited){color:#ccc;}
        .fav-btn:hover:not(.favorited){color:#e74c3c;}
        .download-btn{background:#2e7d32;color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600;transition:0.2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
        .download-btn:hover{background:#1b5e20;}
        
        /* Favorite Page */
        .empty-msg{text-align:center;color:#888;padding:40px;font-size:18px;}
        
        /* Mobile */
        @media(max-width:768px){
            .sidebar{width:200px;}
            .main{margin-left:0;}
            .main.expanded{margin-left:0;}
            .sidebar.closed{left:-200px;}
            .video-grid{grid-template-columns:1fr;}
            .health-banner{font-size:18px;padding:12px 18px;}
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>Health Hub</span>
            <button class="close-btn" onclick="toggleSidebar()">×</button>
        </div>
        <div class="menu-item active" onclick="showPage('home', this)">
            <span>🏠</span> Home
        </div>
        <div class="menu-item" onclick="showPage('upload', this)">
            <span>📤</span> Upload Videos
        </div>
        <div class="menu-item" onclick="showPage('favorite', this)">
            <span>❤️</span> Favorite
        </div>
    </div>

    <!-- Main Content -->
    <div class="main" id="mainContent">
        <div class="topbar">
            <button class="menu-icon" onclick="toggleSidebar()">☰</button>
            <h2 id="pageTitle">Home</h2>
        </div>

        <!-- Health Banner -->
        <div class="health-banner">
            <span>💪</span> Health is everything
        </div>

        <!-- Home Page -->
        <div class="page active" id="page-home">
            <h3 style="margin-bottom:15px;">All Videos</h3>
            <div class="video-grid" id="homeGrid"></div>
        </div>

        <!-- Upload Page -->
        <div class="page" id="page-upload">
            <div class="upload-box">
                <h2>Upload Video</h2>
                <p>Select a video to preview and publish</p>
                <label for="vid" class="btn">Choose Video</label>
                <input type="file" id="vid" accept="video/*">
                <div id="msg"></div>
                <video id="videoPreview" controls></video>
                <br><br>
                <button class="btn" style="background:#2e7d32;display:none;" id="publishBtn" onclick="publishVideo()">Publish Video</button>
            </div>
        </div>

        <!-- Favorite Page -->
        <div class="page" id="page-favorite">
            <h3 style="margin-bottom:15px;">Favorite Videos</h3>
            <div class="video-grid" id="favGrid"></div>
            <div class="empty-msg" id="emptyFav">No favorite videos yet.</div>
        </div>
    </div>

    <script>
        // Data storage
        let videos = [];
        let favorites = [];
        let currentUpload = null;

        // Toggle sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const main = document.getElementById('mainContent');
            sidebar.classList.toggle('closed');
            main.classList.toggle('expanded');
        }

        // Show page
        function showPage(page, menuItem) {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            if(menuItem) menuItem.classList.add('active');
            
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.getElementById('page-' + page).classList.add('active');
            document.getElementById('pageTitle').textContent = 
                page === 'home' ? 'Home' : 
                page === 'upload' ? 'Upload Videos' : 'Favorite';
            
            if(window.innerWidth <= 768) toggleSidebar();
        }

        // Format file size
        function formatSize(bytes) {
            if(bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        // Detect aspect ratio
        function detectAspect(videoElement, callback) {
            if(videoElement.readyState >= 2) {
                const w = videoElement.videoWidth;
                const h = videoElement.videoHeight;
                const ratio = w / h;
                if(ratio > 1.3) callback('16:9', 'landscape');
                else if(ratio < 0.8) callback('9:16', 'portrait');
                else callback('1:1', 'square');
            } else {
                videoElement.addEventListener('loadedmetadata', function() {
                    const w = this.videoWidth;
                    const h = this.videoHeight;
                    const ratio = w / h;
                    if(ratio > 1.3) callback('16:9', 'landscape');
                    else if(ratio < 0.8) callback('9:16', 'portrait');
                    else callback('1:1', 'square');
                });
            }
        }

        // Upload video preview
        document.getElementById('vid').addEventListener('change', function(e) {
            const f = e.target.files[0];
            const m = document.getElementById('msg');
            const v = document.getElementById('videoPreview');
            const pb = document.getElementById('publishBtn');
            
            if(f) {
                if(f.type.startsWith('video/')) {
                    m.className = 'ok';
                    const sizeStr = formatSize(f.size);
                    m.textContent = '✅ Ready: ' + f.name + ' (' + sizeStr + ')';
                    const url = URL.createObjectURL(f);
                    v.src = url;
                    v.style.display = 'block';
                    v.load();
                    pb.style.display = 'inline-block';
                    currentUpload = { file: f, url: url, name: f.name, size: f.size };
                } else {
                    m.className = 'err';
                    m.textContent = '❌ Please select a valid video file.';
                    v.style.display = 'none';
                    v.src = '';
                    pb.style.display = 'none';
                    currentUpload = null;
                }
            }
        });

        // Publish video (FIXED - Store as Base64 permanently)
        function publishVideo() {
            if(!currentUpload) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result; // Permanent Base64 string
                
                const newVideo = {
                    id: Date.now(),
                    name: currentUpload.name,
                    url: base64Data,  // <--- Store Base64 instead of blob URL
                    size: currentUpload.size,
                    favorite: false,
                    aspect: 'Loading...'
                };
                
                // Detect aspect ratio
                const tempVideo = document.createElement('video');
                tempVideo.src = base64Data;
                detectAspect(tempVideo, function(ratio) {
                    newVideo.aspect = ratio;
                    renderHome();
                    renderFavorites();
                });
                
                videos.push(newVideo);
                renderHome();
                renderFavorites();
                
                document.getElementById('vid').value = '';
                document.getElementById('videoPreview').style.display = 'none';
                document.getElementById('videoPreview').src = '';
                document.getElementById('publishBtn').style.display = 'none';
                document.getElementById('msg').textContent = '✅ Published successfully!';
                document.getElementById('msg').className = 'ok';
                currentUpload = null;
                
                showPage('home', document.querySelector('.menu-item'));
            };
            reader.readAsDataURL(currentUpload.file); // Convert file to Base64
        }

        // Toggle favorite
        function toggleFavorite(id) {
            const video = videos.find(v => v.id === id);
            if(video) {
                video.favorite = !video.favorite;
                if(video.favorite) {
                    if(!favorites.find(v => v.id === id)) favorites.push(video);
                } else {
                    favorites = favorites.filter(v => v.id !== id);
                }
                renderHome();
                renderFavorites();
            }
        }

        // Download video (FIXED - Works with Base64)
        function downloadVideo(id) {
            const video = videos.find(v => v.id === id);
            if(video && video.url.startsWith('data:video/')) {
                const a = document.createElement('a');
                a.href = video.url;  // Base64 string works directly
                a.download = video.name || 'video.mp4';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } else {
                alert('Download failed: Video data not available.');
            }
        }

        // Render home grid
        function renderHome() {
            const grid = document.getElementById('homeGrid');
            if(videos.length === 0) {
                grid.innerHTML = '<div style="text-align:center;color:#888;padding:40px;grid-column:1/-1;">No videos uploaded yet. Go to Upload Videos!</div>';
                return;
            }
            grid.innerHTML = videos.map(v => `
                <div class="video-card" data-id="${v.id}">
                    <div class="video-wrapper">
                        <video src="${v.url}" controls></video>
                    </div>
                    <div class="info">
                        <div class="row1">
                            <span class="title">${v.name}</span>
                            <div>
                                <button class="download-btn" onclick="downloadVideo(${v.id})">⬇️</button>
                                <button class="fav-btn ${v.favorite ? 'favorited' : ''}" onclick="toggleFavorite(${v.id})">${v.favorite ? '❤️' : '🤍'}</button>
                            </div>
                        </div>
                        <div class="meta">
                            <span class="size">${formatSize(v.size)}</span>
                            <span class="aspect">${v.aspect || 'Loading...'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Render favorites
        function renderFavorites() {
            const grid = document.getElementById('favGrid');
            const empty = document.getElementById('emptyFav');
            
            if(favorites.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';
            grid.innerHTML = favorites.map(v => `
                <div class="video-card" data-id="${v.id}">
                    <div class="video-wrapper">
                        <video src="${v.url}" controls></video>
                    </div>
                    <div class="info">
                        <div class="row1">
                            <span class="title">${v.name}</span>
                            <div>
                                <button class="download-btn" onclick="downloadVideo(${v.id})">⬇️</button>
                                <button class="fav-btn favorited" onclick="toggleFavorite(${v.id})">❤️</button>
                            </div>
                        </div>
                        <div class="meta">
                            <span class="size">${formatSize(v.size)}</span>
                            <span class="aspect">${v.aspect || 'Loading...'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Initial render
        renderHome();
        renderFavorites();
    </script>
</body>
</html>
